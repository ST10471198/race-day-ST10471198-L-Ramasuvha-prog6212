name: Validate RaceDay Part 1

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Check docs folder
      run: |
        if [ -d "docs" ]; then
          echo "✅ docs folder exists"
          ls -la docs/
        else
          echo "❌ docs folder missing"
          exit 1
        fi
    
    - name: Check ERD file
      run: |
        if ls docs/ | grep -qi "erd"; then
          echo "✅ ERD file found"
        else
          echo "❌ No ERD file found"
          exit 1
        fi
    
    - name: Check SQL script
      run: |
        if [ -f "docs/script.sql" ]; then
          echo "✅ script.sql found"
        else
          echo "❌ script.sql missing"
          exit 1
        fi
    
    - name: Validate SQL
      run: |
        SQL_FILE="docs/script.sql"
        
        # Check CREATE TABLE
        if grep -q "CREATE TABLE" "$SQL_FILE"; then
          echo "✅ CREATE TABLE found"
        else
          echo "❌ No CREATE TABLE"
          exit 1
        fi
        
        # Check PRIMARY KEY
        if grep -q "PRIMARY KEY" "$SQL_FILE"; then
          echo "✅ PRIMARY KEY found"
        else
          echo "❌ No PRIMARY KEY"
          exit 1
        fi
        
        # Check FOREIGN KEY
        if grep -q "FOREIGN KEY" "$SQL_FILE"; then
          echo "✅ FOREIGN KEY found"
        else
          echo "❌ No FOREIGN KEY"
          exit 1
        fi
        
        # Check INSERT
        if grep -q "INSERT INTO" "$SQL_FILE"; then
          echo "✅ INSERT INTO found"
        else
          echo "⚠️ No INSERT INTO (seed data)"
        fi
        
        # Count tables
        TABLES=$(grep -c "CREATE TABLE" "$SQL_FILE")
        if [ "$TABLES" -ge 6 ]; then
          echo "✅ $TABLES tables found (min 6)"
        else
          echo "❌ Only $TABLES tables (need 6+)"
          exit 1
        fi
    
    - name: Check commits
      run: |
        COMMITS=$(git rev-list --count HEAD)
        echo "Commits: $COMMITS"
        if [ "$COMMITS" -ge 20 ]; then
          echo "✅ 20+ commits met"
        else
          echo "❌ Only $COMMITS commits (need 20)"
          exit 1
        fi
    
    - name: Check README
      run: |
        if [ -f "README.md" ]; then
          echo "✅ README.md found"
        else
          echo "❌ README.md missing"
          exit 1
        fi
    
    - name: Success
      run: echo "✅ All checks passed - Green Build!"
